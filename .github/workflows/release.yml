name: Publish desktop release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            runner: windows-latest
            script: package:windows
          - platform: linux
            runner: ubuntu-latest
            script: package:linux
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        working-directory: app
        run: npm install --no-audit --no-fund
      - name: Package desktop app
        working-directory: app
        run: npm run ${{ matrix.script }}
      - name: Create Windows archive
        if: matrix.platform == 'windows'
        shell: pwsh
        run: Compress-Archive -Path "release/X Browser-win32-x64" -DestinationPath "release/X-Browser-windows-x64.zip"
      - name: Create Linux archive
        if: matrix.platform == 'linux'
        run: tar -czf release/X-Browser-linux-x64.tar.gz -C release "X Browser-linux-x64"
      - uses: actions/upload-artifact@v4
        with:
          name: x-browser-${{ matrix.platform }}-release
          path: release/X-Browser-*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: x-browser-*-release
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*
          fail_on_unmatched_files: true
