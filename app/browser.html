<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#08090b"><title>X Browser</title>
  <style>
    :root{color-scheme:dark;--bg:#08090b;--panel:#111216;--panel2:#1a1b20;--line:#ffffff15;--text:#f4f4f7;--muted:#92939b;--accent:#c5c9ff;--side:220px;--tabs-h:44px;--bar-h:60px}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden;user-select:none}.app{height:100dvh;width:100vw;display:grid;grid-template-rows:var(--tabs-h) var(--bar-h) minmax(0,1fr);background:radial-gradient(ellipse 58% 48% at 68% 35%,#aeb4ff0d,transparent 70%),var(--bg)}.tabstrip{grid-row:1;min-width:0;display:flex;align-items:end;gap:7px;padding:4px 10px 0;background:#101114;border-bottom:1px solid var(--line);-webkit-app-region:drag}.brand{display:flex;align-items:center;gap:7px;padding:0 8px 6px 3px;color:#f5f5fa;font-size:16px;font-weight:600;letter-spacing:-.6px;white-space:nowrap}.brand-logo{width:30px;height:30px;object-fit:contain;flex:none}.brand-x{font-size:24px;font-weight:200;line-height:1;text-shadow:0 0 19px #fff9}.tablist{height:100%;display:flex;align-items:end;gap:5px;min-width:0;overflow:auto;scrollbar-width:none}.tablist::-webkit-scrollbar{display:none}.tab{height:calc(var(--tabs-h) - 6px);min-width:150px;max-width:235px;padding:0 9px;display:flex;align-items:center;gap:7px;border:1px solid var(--line);border-bottom-color:#17181c;border-radius:11px 11px 0 0;background:#191a1f;color:#d9dae1;-webkit-app-region:no-drag}.tab.active{background:#25262c;color:white}.tab-title{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px}.tab-icon{width:16px;height:16px;border-radius:5px;display:grid;place-items:center;background:#ffffff11;font-size:10px}.tab-close,.add-tab,.win-btn,.tool{border:0;background:transparent;color:#c7c8d0;display:grid;place-items:center;cursor:pointer}.tab-close{width:22px;height:22px;border-radius:6px;color:#898a94;font-size:16px}.tab-close:hover,.add-tab:hover,.win-btn:hover,.tool:hover{background:#ffffff11;color:white}.add-tab{width:31px;height:30px;flex:none;border-radius:8px;font-size:22px;line-height:1;-webkit-app-region:no-drag}.window-controls{margin-left:auto;display:flex;gap:3px;padding:0 3px 5px;-webkit-app-region:no-drag}.win-btn{width:32px;height:26px;border-radius:7px;font-size:13px}
    .toolbar{grid-row:2;height:var(--bar-h);display:flex;align-items:center;gap:8px;padding:0 13px;background:#101114;border-bottom:1px solid var(--line)}.navgroup,.toolgroup{display:flex;align-items:center;gap:2px;flex:none}.tool{width:35px;height:35px;border-radius:10px;flex:none}.tool:disabled{opacity:.35}.tool svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.address{height:39px;max-width:1080px;flex:1;min-width:100px;display:flex;align-items:center;gap:9px;padding:0 10px;margin:0 auto;border:1px solid #ffffff19;border-radius:999px;background:#08090bf0;box-shadow:inset 0 1px #ffffff06}.address:focus-within{border-color:#c5c9ff66;box-shadow:0 0 0 3px #c5c9ff13}.address-icon{color:#92939d;font-size:12px}.address input{width:100%;min-width:0;border:0;outline:0;background:none;color:#eee;font:inherit;font-size:13px}.address input::placeholder{color:#80818b}.busy{width:8px;height:8px;border-radius:50%;background:#aeb2ff;opacity:0;flex:none}.busy.on{opacity:1;animation:pulse .8s infinite}.toolbar-actions{display:flex;align-items:center;gap:2px;flex:none}.browser-area{grid-row:3;display:flex;position:relative;min-height:0;overflow:hidden}.vertical-tabs{display:none;width:var(--side);flex:none;min-height:0;overflow:auto;border-right:1px solid var(--line);padding:12px 10px;background:#0d0e11}.vertical-label{padding:7px 9px 11px;color:#82848e;text-transform:uppercase;font-size:10px;letter-spacing:.12em}.vertical-list{display:grid;gap:4px}.vertical-list .tab{height:39px;max-width:none;min-width:0;width:100%;border:0;border-radius:10px;background:transparent}.vertical-list .tab.active{background:#ffffff12}.page-area{position:relative;min-width:0;min-height:0;flex:1;overflow:hidden}.home,.tab-overview{position:absolute;inset:0;overflow:auto}.home{display:flex;align-items:center;flex-direction:column;padding:clamp(30px,7vh,74px) 24px 30px;background:radial-gradient(ellipse 58% 52% at 67% 36%,#aeb4ff10,transparent 70%),#08090b}.hero{width:min(760px,100%);margin:auto 0 0;text-align:center}.hero-logo{width:88px;height:88px;object-fit:contain;filter:drop-shadow(0 0 28px #c4c8ff99);font-size:77px;font-weight:200;line-height:1;letter-spacing:-10px;transform:rotate(-8deg);text-shadow:0 0 32px #fff8,0 0 105px #c4c8ffaa;margin:0 0 17px}.hero-wordmark{margin:-12px 0 8px;font-size:clamp(17px,2vw,23px);font-weight:600;letter-spacing:.12em;background:linear-gradient(100deg,#fff,#afb4ff 58%,#fff);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 0 28px #b9beff35}.hero h1{font-size:clamp(25px,3vw,37px);font-weight:450;letter-spacing:-1.4px;margin:0 0 27px}.search{height:60px;display:flex;align-items:center;gap:11px;padding:0 14px;border:1px solid #ffffff22;border-radius:999px;background:#08090bf0;box-shadow:0 18px 70px #0009}.search:focus-within{border-color:#c5c9ff55;box-shadow:0 0 0 4px #c5c9ff13}.search svg{width:21px;height:21px;stroke:#c2c3cd;fill:none;stroke-width:1.8;flex:none}.search input{flex:1;min-width:0;border:0;outline:0;background:none;color:white;font:inherit;font-size:15px}.search input::placeholder{color:#90919b}.search button{height:38px;padding:0 16px;border:0;border-radius:999px;background:#e6e7f4;color:#15161a;font-weight:600;cursor:pointer}.hint{margin:10px 0 0;color:#81828c;font-size:11px}.section{width:min(760px,100%);margin:30px 0 0}.section-title{display:flex;align-items:center;justify-content:space-between;margin:0 1px 12px;color:#dedfe6;font-size:13px;font-weight:550}.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.tile{min-height:76px;display:flex;align-items:center;gap:10px;padding:12px;border:1px solid var(--line);border-radius:14px;background:linear-gradient(145deg,#ffffff09,#ffffff03);color:white;text-align:left;cursor:pointer;transition:.16s}.tile:hover{transform:translateY(-2px);border-color:#ffffff2c;background:#ffffff0d}.tile-icon{width:36px;height:36px;display:grid;place-items:center;border-radius:11px;background:#ffffff11;font-size:16px;flex:none}.tile b{display:block;font-size:12px;font-weight:550}.tile small{display:block;margin-top:2px;color:#868792;font-size:10px}.recent{margin-top:25px;color:#777984;font-size:11px}.tab-overview{display:none;padding:32px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));align-content:start;gap:14px;background:#0a0b0e}.tab-overview.visible{display:grid}.overview-card{min-height:145px;position:relative;display:flex;flex-direction:column;justify-content:space-between;padding:16px;border:1px solid #ffffff19;border-radius:18px;background:linear-gradient(145deg,#ffffff0d,#ffffff04);cursor:pointer}.overview-card:hover{border-color:#c5c9ff77;background:#ffffff12}.overview-card strong{font-size:15px;font-weight:550}.overview-card small{color:#9c9da7;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.overview-card button{position:absolute;right:10px;top:10px;border:0;background:#ffffff11;color:white;border-radius:8px;width:25px;height:25px;cursor:pointer}.overview-new{display:grid;place-items:center;color:#b8b9c5;font-size:30px}.toast{position:fixed;left:50%;bottom:18px;transform:translate(-50%,10px);opacity:0;padding:9px 14px;border:1px solid #ffffff22;border-radius:10px;background:#25262c;color:white;transition:.2s;pointer-events:none;z-index:8}.toast.show{opacity:1;transform:translate(-50%,0)}dialog{width:min(520px,calc(100% - 28px));border:1px solid #ffffff22;border-radius:22px;background:#17181d;color:#f4f4f7;padding:22px;box-shadow:0 25px 100px #000b}dialog::backdrop{background:#000a;backdrop-filter:blur(5px)}.settings-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:15px}.settings-head h2{margin:0;font-size:20px;font-weight:550}.close-dialog{border:0;background:#ffffff10;color:#ddd;border-radius:9px;width:32px;height:32px;font-size:18px;cursor:pointer}.setting-row{display:grid;grid-template-columns:1fr 190px;align-items:center;gap:14px;padding:12px 0;border-top:1px solid #ffffff10}.setting-row strong{display:block;font-size:13px;font-weight:550}.setting-row small{display:block;color:#9899a2;font-size:11px;margin-top:2px}.setting-row select{width:100%;padding:9px 11px;border:1px solid #ffffff1c;border-radius:10px;background:#0d0e11;color:white;font:inherit}.check-row{display:flex;align-items:center;gap:9px;color:#d7d8df;font-size:13px;padding-top:12px}.check-row input{accent-color:#aeb4ff}.settings-actions{display:flex;justify-content:flex-end;margin-top:18px}.settings-actions button{border:0;border-radius:10px;padding:9px 15px;background:#e6e7f4;color:#16171b;font-weight:600;cursor:pointer}
    body[data-toolbar-position="compact"]{--tabs-h:36px;--bar-h:47px}body[data-toolbar-position="bottom"] .app{grid-template-rows:var(--tabs-h) minmax(0,1fr) var(--bar-h)}body[data-toolbar-position="bottom"] .toolbar{grid-row:3;border-top:1px solid var(--line);border-bottom:0}body[data-toolbar-position="bottom"] .browser-area{grid-row:2}body[data-toolbar-position="compact"] .brand{font-size:14px;padding-bottom:3px}body[data-toolbar-position="compact"] .brand-logo{width:25px;height:25px}body[data-toolbar-position="compact"] .brand-x{font-size:20px}body[data-toolbar-position="compact"] .tab{height:calc(var(--tabs-h) - 5px);min-width:130px}body[data-toolbar-position="compact"] .tool{width:31px;height:31px}body[data-tab-layout="vertical"] .tablist{display:none}body[data-tab-layout="vertical"] .vertical-tabs{display:block}body[data-tab-layout="vertical"] .brand{margin-right:auto}body[data-tab-layout="vertical"] .browser-area{display:flex}
    body.light{--bg:#f1f2f7;--panel:#fff;--panel2:#eeeef3;--line:#00000018;--text:#202127;color-scheme:light}.light .tabstrip,.light .toolbar{background:#f4f4f7}.light .tab{background:#e9e9ef;color:#303138;border-color:#00000012}.light .tab.active{background:white}.light .vertical-tabs{background:#f6f6f8}.light .vertical-list .tab.active{background:#0000000c}.light .address{background:#fff;border-color:#0000001d}.light .address input{color:#222}.light .home{background:radial-gradient(ellipse 58% 52% at 67% 36%,#9da2ef24,transparent 70%),#f1f2f7}.light .hero h1,.light .section-title{color:#202127}.light .search{background:#ffffffdd;border-color:#0000001e}.light .search input{color:#17181d}.light .tile{background:#ffffff9c;color:#202127;border-color:#00000014}.light .tile:hover{background:white}.light .tile small{color:#666771}.light .tab-overview{background:#f2f2f6}.light .overview-card{background:white;color:#202127;border-color:#00000016}.light dialog{background:#fafafd;color:#202127}.light .setting-row select{background:white;color:#222;border-color:#0000001b}.light .check-row{color:#34353c}
    @keyframes pulse{50%{opacity:.3}}@media(max-width:720px){:root{--tabs-h:42px;--bar-h:54px}.brand{padding:0 4px 5px 1px;font-size:15px}.brand-x{font-size:22px}.tab{min-width:120px;max-width:155px}.window-controls{display:none}.toolbar{padding:0 7px;gap:4px}.tool{width:31px;height:31px}.navgroup{gap:0}.navgroup #forward{display:none}.toolbar-actions #settingsBtn{display:none}.home{padding:42px 15px 24px}.hero-logo{font-size:64px}.hero h1{font-size:27px;margin-bottom:21px}.search{height:55px;padding:0 10px}.search input{font-size:14px}.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.tile{min-height:68px;padding:9px;gap:8px}.tile-icon{width:33px;height:33px}.section{margin-top:24px}body[data-tab-layout="vertical"] .vertical-tabs{display:none}body[data-tab-layout="vertical"] .tablist{display:flex}body[data-toolbar-position="bottom"] .app{grid-template-rows:42px minmax(0,1fr) 58px}body[data-toolbar-position="bottom"] .toolbar{grid-row:3}body[data-toolbar-position="bottom"] .browser-area{grid-row:2}}
    @media(max-width:400px){.brand span:last-child{display:none}.tab{min-width:103px;padding:0 6px}.toolbar-actions #bookmark{display:none}.toolbar{padding:0 4px}.address{gap:5px;padding:0 7px}.address input{font-size:12px}.search button{padding:0 11px}.overview-card{min-height:120px}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important}}
  </style>
  <style>
    [hidden]{display:none!important}#webviewHost{position:absolute;inset:0;z-index:1}#webviewHost webview{position:absolute;inset:0;width:100%;height:100%;border:0;background:white}.home{z-index:2}.tab-overview{z-index:3}
  </style>
</head>
<body data-toolbar-position="top" data-tab-layout="horizontal">
  <div class="app" id="app">
    <header class="tabstrip">
      <div class="brand"><img class="brand-logo" src="logo.svg" alt=""><span>Browser</span></div>
      <div class="tablist" id="tablist" aria-label="Вкладки"></div>
      <button class="add-tab" id="addTab" title="Новая вкладка" aria-label="Новая вкладка">+</button>
      <div class="window-controls"><button class="win-btn" id="minimize" title="Свернуть">—</button><button class="win-btn" id="maximize" title="Развернуть">□</button><button class="win-btn" id="closeWindow" title="Закрыть">×</button></div>
    </header>
    <div class="toolbar" id="toolbar">
      <div class="navgroup"><button class="tool" id="back" title="Назад" aria-label="Назад"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6M9 12h11"/></svg></button><button class="tool" id="forward" title="Вперёд" aria-label="Вперёд"><svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6m6 6H4"/></svg></button><button class="tool" id="reload" title="Обновить" aria-label="Обновить"><svg viewBox="0 0 24 24"><path d="M20 7v5h-5M4 17v-5h5M5.6 9A7 7 0 0 1 18 6l2 2m-16 8 2 2a7 7 0 0 0 12.4-3"/></svg></button><button class="tool" id="home" title="Домой" aria-label="Домой"><svg viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-6v-7h-4v7H4a1 1 0 0 1-1-1z"/></svg></button></div>
      <form class="address" id="addressForm"><span class="address-icon">◉</span><input id="address" placeholder="Поиск Google или адрес сайта" autocomplete="off" aria-label="Поиск Google или адрес сайта"><span class="busy" id="busy"></span></form>
      <div class="toolbar-actions"><button class="tool" id="bookmark" title="Добавить в закладки" aria-label="Добавить в закладки">☆</button><button class="tool" id="overviewBtn" title="Все вкладки" aria-label="Все вкладки"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="15" height="15" rx="2"/><path d="M7 2h14v15"/></svg></button><button class="tool" id="settingsBtn" title="Настройки интерфейса" aria-label="Настройки интерфейса">⚙</button></div>
    </div>
    <main class="browser-area" id="browserArea">
      <aside class="vertical-tabs"><div class="vertical-label">Открытые вкладки</div><div class="vertical-list" id="verticalList"></div></aside>
      <div class="page-area" id="pageArea">
        <section class="home" id="homeView"><div class="hero"><img class="hero-logo" src="logo.svg" alt="X Browser — X над глобусом"><div class="hero-wordmark">X.browser</div><h1 id="greeting">Куда отправимся?</h1><form class="search" id="searchForm"><svg viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 5 5"/></svg><input id="searchInput" placeholder="Искать в Google или ввести адрес" autocomplete="off" aria-label="Поиск Google или адрес сайта"><button type="submit">Найти</button></form><p class="hint">Сайты открываются прямо в X Browser</p></div><section class="section"><h2 class="section-title">Быстрый доступ</h2><div class="tiles" id="tiles"></div></section><div class="recent" id="recent">Личная история хранится на этом устройстве</div></section>
        <section class="tab-overview" id="tabOverview" aria-label="Все открытые вкладки"></section>
        <div id="webviewHost"></div>
      </div>
    </main>
  </div>
  <dialog id="settingsDialog"><div class="settings-head"><h2>Настроить X Browser</h2><button class="close-dialog" id="closeSettings" aria-label="Закрыть">×</button></div>
    <label class="setting-row"><span><strong>Панель адреса</strong><small>Перемести элементы для удобного управления</small></span><select id="toolbarMode"><option value="top">Сверху</option><option value="bottom">Снизу</option><option value="compact">Компактно</option></select></label>
    <label class="setting-row"><span><strong>Вкладки на компьютере</strong><small>Сверху или вертикально слева</small></span><select id="tabMode"><option value="horizontal">Сверху</option><option value="vertical">Слева</option></select></label>
    <label class="setting-row"><span><strong>Тема</strong><small>Тёмное оформление или светлое</small></span><select id="themeMode"><option value="dark">Тёмная</option><option value="light">Светлая</option></select></label>
    <label class="check-row"><input id="showQuick" type="checkbox" checked><span>Показывать быстрые ссылки</span></label>
    <div class="settings-actions"><button id="doneSettings">Готово</button></div>
  </dialog>
  <div class="toast" id="toast" role="status"></div>
  <script src="renderer.js"></script>
</body>
</html>
